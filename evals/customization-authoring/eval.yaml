name: customization-authoring
description: The installed authoring skill creates a structurally valid skill with task and non-trigger evals.
type: capability
defaults:
  executor: copilot-sdk
  model: gpt-5.4-mini
  timeout: 3m
  runs: 1
agent_environment:
  skills:
    - ../../plugins/customization-authoring/skills/skill-authoring
stimuli:
  - name: authors-skill-and-evals
    prompt: >-
      Use skill-authoring to create skills/change-summary/SKILL.md and
      evals/change-summary/eval.yaml relative to the active workspace root, not
      the installed skill directory. The new change-summary skill reads changes.txt,
      counts its nonempty lines, and writes summary.json with a numeric count and an
      array of those lines named changes. Include a positive task case and an unrelated
      question that must not activate change-summary. Keep the eval outside the skill.
      All requirements and paths are supplied. Create the files without installing
      anything or running paid evals. Don't create other artifacts.
    tags:
      assets: skill:customization-authoring/skill-authoring
      suite: pr
      control: positive
    grading_environment:
      files:
        - src: ../graders/dist/authoring.mjs
          dest: .grading/authoring.mjs
    artifacts:
      include:
        - skills/change-summary/SKILL.md
        - evals/change-summary/eval.yaml
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required: [skill-authoring]
      - type: program
        config:
          program: node
          args: [.grading/authoring.mjs]
          timeout: 60s
  - name: does-not-author-for-factual-question
    prompt: What is the capital of France? Reply with only the city name.
    tags:
      assets: skill:customization-authoring/skill-authoring
      control: negative
    graders:
      - type: completed
      - type: skill-invocation
        config:
          disallowed: [skill-authoring]
      - type: output-contains
        config:
          substring: Paris
      - type: diff-empty
scoring:
  threshold: 1
