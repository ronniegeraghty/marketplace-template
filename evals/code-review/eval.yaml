name: code-review-workflow
description: A review skill delegates to the bundled read-only reviewer and reports a real boundary bug without inventing defects.
type: capability
defaults:
  executor: copilot-sdk
  model: gpt-5.4-mini
  timeout: 3m
  runs: 1
agent_environment:
  skills:
    - ../../plugins/code-review/skills/adversarial-review
  files:
    - src: ../../plugins/code-review/com.github.copilot/agents/code-reviewer.agent.md
      dest: .github/agents/code-reviewer.agent.md
stimuli:
  - name: identifies-page-boundary-defect
    prompt: >-
      Use adversarial-review to review page.js. It must return up to size items from
      the zero-based pageNumber and reject invalid integer pageNumber/size inputs.
      The caller supplies an array. Delegate the specialist pass to code-reviewer.
      Read only; don't run code or fix anything. Cite the precise source location.
    agent_environment:
      files:
        - src: ../fixtures/review/buggy.js
          dest: page.js
    tags:
      assets:
        - skill:code-review/adversarial-review
        - agent:code-review/code-reviewer
      suite: pr
      control: positive
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required: [adversarial-review]
      - type: tool-calls
        config:
          required:
            - name: ^task$
              args:
                agent_type: ^code-reviewer$
      - type: output-matches
        scope: subagent
        config:
          pattern: 'page\.js(?::|.*line).*[45]'
      - type: output-matches
        scope: subagent
        config:
          pattern: '(?i:off.by.one|one fewer|one less|last (item|element)|size\s*-\s*1)'
      - type: tool-calls
        scope: subagent
        config:
          disallowed: ['^(create|edit|apply_patch|bash|powershell|shell)$']
      - type: diff-empty
  - name: accepts-clean-implementation
    prompt: >-
      Use adversarial-review and delegate a read-only pass to code-reviewer for page.js.
      The caller always supplies an array; pageNumber is zero-based. The function must
      reject noninteger or negative page numbers and nonpositive/noninteger sizes.
      Return up to size elements, or an empty array past the end. Don't demand other
      validation or features. Don't execute code or edit files.
    agent_environment:
      files:
        - src: ../fixtures/review/clean.js
          dest: page.js
    tags:
      assets:
        - skill:code-review/adversarial-review
        - agent:code-review/code-reviewer
      control: negative
    graders:
      - type: completed
      - type: skill-invocation
        config:
          required: [adversarial-review]
      - type: tool-calls
        config:
          required:
            - name: ^task$
              args:
                agent_type: ^code-reviewer$
      - type: output-contains
        scope: subagent
        config:
          substring: No actionable findings.
      - type: diff-empty
  - name: does-not-review-unrelated-question
    prompt: What is two plus two? Reply with only the digit.
    tags:
      assets: skill:code-review/adversarial-review
      control: negative
    graders:
      - type: completed
      - type: skill-invocation
        config:
          disallowed: [adversarial-review]
      - type: output-contains
        config:
          substring: "4"
      - type: diff-empty
scoring:
  threshold: 1
