name: code-reviewer-independent
description: The actual custom agent works without its companion skill.
type: capability
defaults:
  executor: copilot-sdk
  model: gpt-5.4-mini
  timeout: 3m
  runs: 1
agent_environment:
  files:
    - src: ../../../plugins/code-review/com.github.copilot/agents/code-reviewer.agent.md
      dest: .github/agents/code-reviewer.agent.md
    - src: ../../fixtures/review/buggy.js
      dest: page.js
stimuli:
  - name: delegates-without-review-skill
    prompt: >-
      Delegate to the code-reviewer specialist to review page.js, then report its
      findings. The caller supplies an array. A zero-based page must return up to
      size elements. The function rejects invalid integer pageNumber/size inputs.
      Read only, don't run code or edit files, and cite source locations.
    tags:
      assets: agent:code-review/code-reviewer
      suite: pr
      control: positive
    graders:
      - type: completed
      - type: tool-calls
        config:
          required:
            - name: ^task$
              args:
                agent_type: ^code-reviewer$
      - type: output-matches
        scope: subagent
        config:
          pattern: '(?i:off.by.one|one fewer|one less|last (item|element)|size\s*-\s*1)'
      - type: tool-calls
        scope: subagent
        config:
          disallowed: ['^(create|edit|apply_patch|bash|powershell|shell)$']
      - type: diff-empty
scoring:
  threshold: 1
